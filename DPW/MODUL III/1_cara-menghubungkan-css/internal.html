<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Internal CSS</title>
  <style>
    h1 { color: #0f172a; }
    p { color: #475569; }
  </style>
</head>
<body>
  <h1>Halaman dengan Internal CSS</h1>
  <p>Aturan gaya ditulis di dalam tag style
    pada bagian head dokumen.</p>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Tugas Praktikum - Kartu Produk</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="daftar-produk">
    <article class="kartu-produk">
      <img src="perpus.jpg"
        alt="Foto perpustakaan" />
      <h2>Dasar Pemrograman Web</h2>
      <p>Panduan HTML dan CSS untuk pemula.</p>
      <div class="aksi">
        <span class="harga">Rp 89.000</span>
        <button type="button">Pinjam</button>
      </div>
    </article>

    <article class="kartu-produk">
      <img src="cuking.jpeg"
        alt="Foto kucing" />
      <h2>Kucing komputer</h2>
      <p>Konsep dasar kucing dan komputer.</p>
      <div class="aksi">
        <span class="harga">Rp 95.000</span>
        <button type="button">Pinjam</button>
      </div>
    </article>

    <article class="kartu-produk">
      <img src="dilarang-berisik.jpeg"
        alt="Foto dilarang berisik" />
      <h2>Dilarang Berisik di Perpustakaan</h2>
      <p>Pengetahuan tentang aturan dan tata cara berperilaku di perpustakaan.</p>
      <div class="aksi">
        <span class="harga">Rp 91.000</span>
        <button type="button">Pinjam</button>
      </div>
    </article>
  </main>
</body>
</html>

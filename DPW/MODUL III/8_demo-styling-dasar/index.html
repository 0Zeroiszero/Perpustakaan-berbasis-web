<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>Demo Styling Dasar</title>
  <style>
    body {
      font-family: arial, sans-serif;
      background-color: #f0f4f8; }
    h1 { color: #0f172a; margin-bottom: 8px; }
    p { color: #475569; line-height: 1.6; }
    .kotak {
      background-color: #dbeafe; color: #1e3a8a;
      padding: 16px; margin: 24px;
      border: 2px solid #2563eb; }
  </style>
</head>
<body>
  <h1>Contoh Styling Dasar</h1>
  <p>Warna teks, latar, jenis huruf,
    margin, padding, dan border diatur
    melalui CSS.</p>
  <div class="kotak">
    Kotak ini memiliki background,
    padding, border, dan margin.
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator</title>
    <link rel="stylesheet" href="kalkulator.css">
</head>
<body>
    <div class="kalkulator">

        <div class="layar">
            <div class="hasil">0</div>
        </div>

        <div class="tombol">
            <button class="hapus">AC</button>
            <button>DEL</button>
            <button class="operator">÷</button>
            <button class="operator">x</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">-</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">+</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="sama-dengan">=</button>

            <button class="nol">0</button>
            <button>.</button>
        </div>
    </div>
    <script src="kalkulator.js"></script>
</body>
</html>

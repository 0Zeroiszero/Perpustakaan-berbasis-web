<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Buku - PerpustakaanKu</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">📚 PerpustakaanKu</div>
        <nav>
          <a class="nav-link" href="index.html">🏠 Dashboard</a
          ><a class="nav-link active" href="buku.html">📖 Data Buku</a
          ><a class="nav-link" href="anggota.html">👥 Anggota</a
          ><a class="nav-link" href="peminjaman.html">📥 Peminjaman</a
          ><a class="nav-link" href="pengembalian.html">📤 Pengembalian</a>
        </nav>
        <div class="sidebar-bottom">
          <a class="nav-link" href="login.html">🚪 Keluar</a>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <button class="menu-btn" id="menuBtn">☰</button>
          <div>
            <p class="eyebrow">MANAJEMEN</p>
            <h1>Data Buku</h1>
          </div>
          <div class="profile">IK <span>Irfan Kurniawan</span></div>
        </header>
        <section class="content">
          <div class="section-heading">
            <div><p class="muted">Kelola koleksi buku perpustakaan.</p></div>
            <button class="btn primary" onclick="openBookModal()">
              ＋ Tambah Buku
            </button>
          </div>
          <div class="card">
            <div class="toolbar">
              <input
                id="bookSearch"
                class="input"
                placeholder="🔍 Cari judul atau penulis..."
                oninput="renderBooks()"
              /><select
                id="bookCategory"
                class="input"
                onchange="renderBooks()"
              >
                <option value="">Semua kategori</option>
                <option>Pemrograman</option>
                <option>Database</option>
                <option>Jaringan</option>
                <option>Umum</option>
              </select>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Judul</th>
                    <th>Penulis</th>
                    <th>Kategori</th>
                    <th>Stok</th>
                    <th>Status</th>
                    <th>Aksi</th>
                  </tr>
                </thead>
                <tbody id="bookTable"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div class="modal" id="bookModal">
      <div class="modal-box">
        <div class="section-heading">
          <h2 id="bookModalTitle">Tambah Buku</h2>
          <button class="close" onclick="closeModal('bookModal')">×</button>
        </div>
        <form id="bookForm" onsubmit="saveBook(event)">
          <input type="hidden" id="bookId" /><label
            >Judul Buku<input class="input" id="bookTitle" required /></label
          ><label>Penulis<input class="input" id="bookAuthor" required /></label
          ><label
            >Kategori<select class="input" id="bookCat" required>
              <option>Pemrograman</option>
              <option>Database</option>
              <option>Jaringan</option>
              <option>Umum</option>
            </select></label
          ><label
            >Stok<input
              class="input"
              id="bookStock"
              type="number"
              min="0"
              required
          /></label>
          <div class="modal-actions">
            <button
              type="button"
              class="btn secondary"
              onclick="closeModal('bookModal')"
            >
              Batal</button
            ><button class="btn primary">Simpan</button>
          </div>
        </form>
      </div>
    </div>
    <script src="assets/app.js"></script>
    <script>
      renderBooks();
    </script>
  </body>
</html>

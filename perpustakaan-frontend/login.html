<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - PerpustakaanKu</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body class="login-page">
    <div class="login-card">
      <div class="login-logo">📚</div>
      <h1>PerpustakaanKu</h1>
      <p class="muted">Masuk ke sistem perpustakaan</p>
      <form onsubmit="demoLogin(event)">
        <label
          >Username<input
            class="input"
            id="username"
            required
            placeholder="Masukkan username" /></label
        ><label
          >Password<input
            class="input"
            id="password"
            type="password"
            required
            placeholder="Masukkan password" /></label
        ><button class="btn primary full">Login</button>
      </form>
      <p class="login-note">Demo: isi username dan password apa saja.</p>
    </div>
    <script src="assets/app.js"></script>
  </body>
</html>

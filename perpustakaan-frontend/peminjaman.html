<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peminjaman - PerpustakaanKu</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="brand">📚 PerpustakaanKu</div>
        <nav>
          <a class="nav-link" href="index.html">🏠 Dashboard</a
          ><a class="nav-link" href="buku.html">📖 Data Buku</a
          ><a class="nav-link" href="anggota.html">👥 Anggota</a
          ><a class="nav-link active" href="peminjaman.html">📥 Peminjaman</a
          ><a class="nav-link" href="pengembalian.html">📤 Pengembalian</a>
        </nav>
        <div class="sidebar-bottom">
          <a class="nav-link" href="login.html">🚪 Keluar</a>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <button class="menu-btn" id="menuBtn">☰</button>
          <div>
            <p class="eyebrow">TRANSAKSI</p>
            <h1>Peminjaman</h1>
          </div>
          <div class="profile">IK <span>Irfan Kurniawan</span></div>
        </header>
        <section class="content">
          <div class="section-heading">
            <p class="muted">Kelola transaksi peminjaman buku.</p>
            <button class="btn primary" onclick="openLoanModal()">
              ＋ Peminjaman Baru
            </button>
          </div>
          <div class="card">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Anggota</th>
                    <th>Buku</th>
                    <th>Tanggal</th>
                    <th>Jatuh Tempo</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody id="loanTable"></tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div class="modal" id="loanModal">
      <div class="modal-box">
        <div class="section-heading">
          <h2>Peminjaman Baru</h2>
          <button class="close" onclick="closeModal('loanModal')">×</button>
        </div>
        <form onsubmit="saveLoan(event)">
          <label
            >Anggota<select
              class="input"
              id="loanMember"
              required
            ></select></label
          ><label
            >Buku<select class="input" id="loanBook" required></select></label
          ><label
            >Tanggal Pinjam<input
              class="input"
              id="loanDate"
              type="date"
              required /></label
          ><label
            >Jatuh Tempo<input class="input" id="loanDue" type="date" required
          /></label>
          <div class="modal-actions">
            <button
              type="button"
              class="btn secondary"
              onclick="closeModal('loanModal')"
            >
              Batal</button
            ><button class="btn primary">Simpan</button>
          </div>
        </form>
      </div>
    </div>
    <script src="assets/app.js"></script>
    <script>
      renderLoans();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PustakaDigital</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="login-page d-flex align-items-center">
    <div class="container py-5">
        <div class="login-card">
            <div class="text-center">
                <a href="../index.html" class="navbar-brand d-inline-flex align-items-center gap-2">
                    <span class="logo">P</span>
                    PustakaDigital
                </a>
                <h2 class="page-title mt-4">
                    Selamat Datang
                </h2>
                <p class="text-secondary">
                    Masuk ke akun perpustakaanmu.
                </p>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input
                        id="email"
                        type="email"
                        class="form-control"
                        placeholder="nama@email.com"
                        required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input
                        id="password"
                        type="password"
                        class="form-control"
                        placeholder="Masukkan password"
                        required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Masuk sebagai</label>
                    <select id="role" class="form-select">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="d-flex justify-content-between mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label text-secondary">
                            Ingat saya
                        </label>
                    </div>
                    <a href="#" class="text-ungu">
                        Lupa password?
                    </a>
                </div>
                <button class="btn btn-ungu w-100 py-2">
                    Masuk
                </button>
            </form>
            <p class="text-center text-secondary mt-4 mb-0">
                Belum punya akun?
                <a href="#" class="text-ungu fw-bold">
                    Daftar
                </a>
            </p>
        </div>
    </div>
    <script src="../assets/js/script.js"></script>
</body>
</html>

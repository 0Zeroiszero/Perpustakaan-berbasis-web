<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify K - Liquid Glass SVG Generator</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #8b5cf6;
            --accent-hover: #7c3aed;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 1px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 30px;
            text-align: center;
            font-size: 2rem;
        }

        h1 span {
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: var(--glass-shadow);
            width: 100%;
            max-width: 1000px;
            margin-bottom: 30px;
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .controls-header h2 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .member-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-header span {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .color-picker-wrapper label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50%;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            outline: none;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        input[type="text"]:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }

        input::placeholder { color: rgba(255, 255, 255, 0.3); }

        /* Styling untuk File Input */
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 0.85rem;
            height: 100%;
        }

        .file-input-label:hover {
            background: rgba(139, 92, 246, 0.1);
            border-color: var(--accent-color);
            color: white;
        }

        button {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            background: var(--accent-color);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        button.danger {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 6px 10px;
            font-size: 0.8rem;
            border-radius: 8px;
        }

        button.danger:hover {
            background: #ef4444;
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-generate {
            flex: 1;
            background: #10b981;
            font-size: 1rem;
            padding: 16px;
            border-radius: 12px;
        }

        .btn-generate:hover {
            background: #059669;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-download {
            flex: 1;
            background: #3b82f6;
            font-size: 1rem;
            padding: 16px;
            border-radius: 12px;
        }

        .btn-download:hover {
            background: #2563eb;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-copy {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            font-size: 1rem;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.1);
        }

        .preview-container {
            margin-top: 30px;
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: center;
            overflow-x: auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        #svg-preview svg {
            max-width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>Spotify <span>K</span> Generator</h1>

    <div class="glass-panel">
        <div class="controls-header">
            <h2>Konfigurasi Anggota (Data README)</h2>
            <button onclick="addMember()">+ Tambah Anggota</button>
        </div>

        <div id="members-form"></div>

        <div class="btn-group">
            <button class="btn-generate" onclick="generateSVG()">Generate SVG</button>
            <button class="btn-download" onclick="downloadSVG()">Download SVG</button>
            <button class="btn-copy" onclick="copySVGCode()">Copy Code</button>
        </div>
    </div>

    <div class="preview-container">
        <div id="svg-preview">
            <p style="color: rgba(255,255,255,0.3); text-align: center; padding: 40px;">Preview SVG akan muncul di sini...</p>
        </div>
    </div>

    <script>
        // ==========================================
        // DATA DEFAULT (Menggunakan URL dari README)
        // ==========================================
        let members = [
            {
                github: "0Zeroiszero",
                name: "Abdullah Affandi",
                song: "MONEYMONEYMONEY",
                artist: "CORTIS",
                albumUrl: "https://i.scdn.co/image/ab67616d0000b273da2a04ef57dfebfb8946fd49",
                avatarUrl: "https://avatars.githubusercontent.com/u/152183468?v=4",
                barColor: "#a78bfa"
            },
            {
                github: "farelgilangsatrio-cloud",
                name: "Farel Gilang Satrio",
                song: "", 
                artist: "",
                albumUrl: "",
                avatarUrl: "https://avatars.githubusercontent.com/u/257312167?v=4",
                barColor: "#a78bfa"
            },
            {
                github: "irfankurniawan25",
                name: "Irfan Kurniawan",
                song: "", 
                artist: "",
                albumUrl: "",
                avatarUrl: "https://avatars.githubusercontent.com/u/257316167?v=4",
                barColor: "#a78bfa"
            },
            {
                github: "najwa820",
                name: "Najwa Khairunnisa",
                song: "", 
                artist: "",
                albumUrl: "",
                avatarUrl: "https://avatars.githubusercontent.com/u/257311403?v=4",
                barColor: "#a78bfa"
            }
        ];

        let currentSvgCode = "";

        // ==========================================
        // FUNGSI UPLOAD GAMBAR & KONVERSI KE BASE64
        // ==========================================
        function handleFileUpload(event, index, field) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // Buat canvas untuk resize gambar agar ukuran Base64 tidak terlalu besar
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Tentukan ukuran maksimal (Album: 300px, Avatar: 100px)
                    const maxSize = field === 'albumUrl' ? 300 : 100;
                    let width = img.width;
                    let height = img.height;
                    
                    if (width > height) {
                        if (width > maxSize) {
                            height *= maxSize / width;
                            width = maxSize;
                        }
                    } else {
                        if (height > maxSize) {
                            width *= maxSize / height;
                            height = maxSize;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Konversi ke Base64 (menggunakan format JPEG dengan kualitas 0.8 agar ringan)
                    members[index][field] = canvas.toDataURL('image/jpeg', 0.8);
                    
                    // Update preview secara otomatis
                    generateSVG();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Render form ke UI
        function renderForm() {
            const container = document.getElementById('members-form');
            container.innerHTML = '';

            members.forEach((member, index) => {
                const card = document.createElement('div');
                card.className = 'member-card';
                
                // Cek apakah gambar berupa Base64 atau URL biasa
                const isAlbumBase64 = member.albumUrl && member.albumUrl.startsWith('data:image');
                const isAvatarBase64 = member.avatarUrl && member.avatarUrl.startsWith('data:image');

                card.innerHTML = `
                    <div class="card-header">
                        <span>Anggota #${index + 1}</span>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <div class="color-picker-wrapper">
                                <label>Warna Bar:</label>
                                <input type="color" value="${member.barColor}" onchange="updateMember(${index}, 'barColor', this.value)">
                            </div>
                            ${members.length > 1 ? `<button class="danger" onclick="removeMember(${index})">Hapus</button>` : ''}
                        </div>
                    </div>
                    <div class="card-grid">
                        <input type="text" placeholder="Username GitHub" value="${member.github}" onchange="updateMember(${index}, 'github', this.value)">
                        <input type="text" placeholder="Nama Asli" value="${member.name}" onchange="updateMember(${index}, 'name', this.value)">
                        <input type="text" placeholder="Judul Lagu (Kosongkan jika tidak ada)" value="${member.song}" onchange="updateMember(${index}, 'song', this.value)">
                        <input type="text" placeholder="Artis" value="${member.artist}" onchange="updateMember(${index}, 'artist', this.value)">
                        
                        <!-- Input Album Cover (Upload File) -->
                        <div class="file-input-wrapper">
                            <label class="file-input-label">
                                ${isAlbumBase64 ? '✅ Cover Terpasang (Klik untuk ganti)' : '📁 Upload Album Cover'}
                                <input type="file" accept="image/*" onchange="handleFileUpload(event, ${index}, 'albumUrl')">
                            </label>
                        </div>

                        <!-- Input GitHub Avatar (Upload File) -->
                        <div class="file-input-wrapper">
                            <label class="file-input-label">
                                ${isAvatarBase64 ? '✅ Avatar Terpasang (Klik untuk ganti)' : '📁 Upload Foto Profil'}
                                <input type="file" accept="image/*" onchange="handleFileUpload(event, ${index}, 'avatarUrl')">
                            </label>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addMember() {
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
            members.push({
                github: "username",
                name: "Nama Baru",
                song: "Lagu Baru",
                artist: "Artis",
                albumUrl: "",
                avatarUrl: "",
                barColor: randomColor
            });
            renderForm();
        }

        function removeMember(index) {
            if (members.length > 1) {
                members.splice(index, 1);
                renderForm();
            }
        }

        function updateMember(index, field, value) {
            members[index][field] = value;
        }

        // Generate animasi acak untuk bar
        function generateBarAnimation(baseHeight, maxVariation) {
            const points = 6;
            let heights = [];
            for (let i = 0; i < points; i++) {
                heights.push(Math.floor(Math.random() * maxVariation) + baseHeight);
            }
            heights.push(heights[0]);
            return heights;
        }

        // Fungsi Utama: Generate SVG
        function generateSVG() {
            const rowHeight = 180;      
            const paddingTop = 100;      
            const paddingBottom = 40;   
            const cardHeight = 130;     
            
            const totalHeight = paddingTop + (members.length * rowHeight) + paddingBottom;
            const width = 800;

            let svgDefs = `
                <defs>
                    <filter id="glass-shadow" x="-5%" y="-5%" width="110%" height="110%">
                        <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.6" />
                    </filter>
                    
                    <filter id="album-blur" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="15" />
                    </filter>

                    <g id="spotify-logo">
                        <circle cx="15" cy="15" r="15" fill="#FFFFFF"/>
                        <path d="M15 4C8.925 4 4 8.925 4 15s4.925 11 11 11 11-4.925 11-11S21.075 4 15 4zm4.125 15.125c-.15.225-.45.3-.675.15-1.8-1.125-4.05-1.35-6.675-.75-.25.075-.525-.075-.6-.375-.075-.25.075-.525.375-.6 2.85-.6 5.4-.375 7.35.825.225.15.3.45.15.675zm.9-2.025c-.175.3-.525.375-.825.225-2.025-1.275-5.175-1.65-7.575-.9-.3.075-.6-.075-.75-.375-.075-.3.075-.6.375-.75 2.775-.825 6.225-.45 8.55 1.05.3.15.375.525.225.75zm.075-2.175c-2.475-1.425-6.525-1.575-8.775-.9-.375.075-.75-.15-.825-.525-.075-.375.15-.75.525-.825 2.7-.825 7.125-.675 9.975 1.05.3.15.45.6.225.9-.15.3-.6.45-.9.225z" fill="#1DB954"/>
                    </g>
            `;

            members.forEach((_, i) => {
                const yOffset = paddingTop + (i * rowHeight);
                const cardY = yOffset;
                const centerY = cardY + (cardHeight / 2);
                
                svgDefs += `
                    <clipPath id="card-clip-${i}">
                        <rect x="30" y="${cardY}" width="${width - 60}" height="${cardHeight}" rx="16" />
                    </clipPath>
                    <clipPath id="album-clip-${i}">
                        <rect x="55" y="${centerY - 45}" width="90" height="90" rx="12" />
                    </clipPath>
                    <clipPath id="avatar-clip-${i}">
                        <circle cx="135" cy="${centerY + 30}" r="18" />
                    </clipPath>
                    <clipPath id="title-clip-${i}">
                        <rect x="170" y="${centerY - 35}" width="200" height="35" />
                    </clipPath>
                `;
            });
            svgDefs += `</defs>`;

            let svgContent = `
                <svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${totalHeight}" viewBox="0 0 ${width} ${totalHeight}">
                    ${svgDefs}
                    <rect width="${width}" height="${totalHeight}" fill="#121212" />
                    <rect x="20" y="20" width="${width - 40}" height="${totalHeight - 40}" rx="30" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" filter="url(#glass-shadow)" />
                    <use href="#spotify-logo" x="${width - 65}" y="40" transform="scale(1.2)" />
            `;

            members.forEach((member, i) => {
                const yOffset = paddingTop + (i * rowHeight);
                const cardY = yOffset;
                const centerY = cardY + (cardHeight / 2);
                const currentBarColor = member.barColor || '#a78bfa';
                const hasSong = member.song && member.song.trim() !== "";

                let bgImageHTML = '';
                let overlayColor = 'rgba(255, 255, 255, 0.03)';
                let albumCoverHTML = '';
                let textHTML = '';
                let barsSVG = '';
                let playButtonHTML = '';
                let saveButtonHTML = '';
                let dotsHTML = '';

                // Fallback jika gambar belum di-upload
                const albumSrc = member.albumUrl || 'https://via.placeholder.com/300x300/1e293b/ffffff?text=No+Cover';
                const avatarSrc = member.avatarUrl || 'https://via.placeholder.com/100x100/1e293b/ffffff?text=Avatar';

                if (hasSong) {
                    bgImageHTML = `<image href="${albumSrc}" x="30" y="${cardY}" width="${width - 60}" height="${cardHeight}" clip-path="url(#card-clip-${i})" preserveAspectRatio="xMidYMid slice" filter="url(#album-blur)" />`;
                    overlayColor = 'rgba(0, 0, 0, 0.65)'; 
                    
                    albumCoverHTML = `
                        <rect x="55" y="${centerY - 45}" width="90" height="90" rx="12" fill="#ffffff" filter="drop-shadow(0px 6px 10px rgba(0,0,0,0.5))" />
                        <image href="${albumSrc}" x="55" y="${centerY - 45}" width="90" height="90" clip-path="url(#album-clip-${i})" preserveAspectRatio="xMidYMid slice" />
                    `;

                    const displaySong = member.song.length > 25 ? member.song.substring(0, 25) + '...' : member.song;
                    const displayArtist = member.artist.length > 20 ? member.artist.substring(0, 20) + '...' : member.artist;

                    textHTML = `
                        <g clip-path="url(#title-clip-${i})">
                            <text x="370" y="${centerY - 12}" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">
                                ${displaySong}
                                <animate attributeName="x" values="370; -400" dur="8s" repeatCount="indefinite" />
                            </text>
                        </g>
                        
                        <rect x="170" y="${centerY + 5}" width="55" height="18" rx="4" fill="#ffffff" />
                        <text x="197.5" y="${centerY + 18}" fill="#000000" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Preview</text>
                        <text x="235" y="${centerY + 18}" fill="#cbd5e1" font-family="sans-serif" font-size="13" font-weight="500">${displayArtist}</text>

                        <circle cx="180" cy="${centerY + 38}" r="10" fill="none" stroke="#ffffff" stroke-width="1.5" />
                        <line x1="175" y1="${centerY + 38}" x2="185" y2="${centerY + 38}" stroke="#ffffff" stroke-width="1.5" />
                        <line x1="180" y1="${centerY + 33}" x2="180" y2="${centerY + 43}" stroke="#ffffff" stroke-width="1.5" />
                        <text x="200" y="${centerY + 41}" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="500">Save on Spotify</text>
                    `;

                    const numBars = 15;
                    const barWidth = 8;
                    const barGap = 10;
                    const startX = 400;
                    const baselineY = centerY + 45;

                    for (let b = 0; b < numBars; b++) {
                        const animHeights = generateBarAnimation(15, 25);
                        const xPos = startX + (b * (barWidth + barGap));
                        const heightValues = animHeights.join(';');
                        const yValues = animHeights.map(h => baselineY - h).join(';');
                        const dur = (0.8 + Math.random() * 0.4).toFixed(2) + 's';

                        barsSVG += `
                            <rect x="${xPos}" y="${baselineY - 15}" width="${barWidth}" height="15" rx="4" fill="${currentBarColor}" opacity="0.9">
                                <animate attributeName="height" values="${heightValues}" dur="${dur}" repeatCount="indefinite" />
                                <animate attributeName="y" values="${yValues}" dur="${dur}" repeatCount="indefinite" />
                            </rect>
                        `;
                    }

                    playButtonHTML = `
                        <circle cx="${width - 80}" cy="${centerY}" r="28" fill="#1db954" filter="drop-shadow(0px 4px 8px rgba(29, 185, 84, 0.4))" />
                        <polygon points="${width - 88},${centerY - 12} ${width - 68},${centerY} ${width - 88},${centerY + 12}" fill="#ffffff" />
                    `;

                    dotsHTML = `
                        <circle cx="${width - 88}" cy="${centerY + 42}" r="2.5" fill="#cbd5e1" />
                        <circle cx="${width - 80}" cy="${centerY + 42}" r="2.5" fill="#cbd5e1" />
                        <circle cx="${width - 72}" cy="${centerY + 42}" r="2.5" fill="#cbd5e1" />
                    `;
                } else {
                    albumCoverHTML = `
                        <rect x="55" y="${centerY - 45}" width="90" height="90" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
                        <text x="100" y="${centerY + 8}" fill="rgba(255,255,255,0.15)" font-family="sans-serif" font-size="30" text-anchor="middle">♪</text>
                    `;

                    textHTML = `
                        <text x="170" y="${centerY + 5}" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="16" font-weight="500">Tidak ada lagu yang diputar</text>
                    `;
                }

                svgContent += `
                    <g>
                        <text x="40" y="${yOffset - 20}" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">${member.github}</text>
                        <text x="${width - 90}" y="${yOffset - 20}" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11" text-anchor="end" letter-spacing="0.5">${member.name}</text>

                        ${bgImageHTML}
                        <rect x="30" y="${cardY}" width="${width - 60}" height="${cardHeight}" rx="16" fill="${overlayColor}" />
                        <rect x="30" y="${cardY}" width="${width - 60}" height="${cardHeight}" rx="16" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

                        ${albumCoverHTML}

                        <circle cx="135" cy="${centerY + 30}" r="18" fill="#1e293b" stroke="#ffffff" stroke-width="2.5" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.5))" />
                        <image href="${avatarSrc}" x="117" y="${centerY + 12}" width="36" height="36" clip-path="url(#avatar-clip-${i})" preserveAspectRatio="xMidYMid slice" />

                        ${textHTML}
                        ${saveButtonHTML}
                        ${barsSVG}
                        ${playButtonHTML}
                        ${dotsHTML}
                    </g>
                `;
            });

            svgContent += `</svg>`;

            currentSvgCode = svgContent;
            document.getElementById('svg-preview').innerHTML = svgContent;
        }

        function downloadSVG() {
            if (!currentSvgCode) {
                alert("Silakan klik 'Generate SVG' terlebih dahulu untuk membuat SVG.");
                return;
            }
            const blob = new Blob([currentSvgCode], {type: "image/svg+xml;charset=utf-8"});
            const url = URL.createObjectURL(blob);
            const downloadLink = document.createElement('a');
            downloadLink.href = url;
            downloadLink.download = "spotify_k.svg";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(url);
        }

        function copySVGCode() {
            if (!currentSvgCode) {
                alert("Silakan klik 'Generate SVG' terlebih dahulu untuk membuat SVG.");
                return;
            }
            navigator.clipboard.writeText(currentSvgCode).then(() => {
                alert("Kode SVG berhasil dicopy ke clipboard!");
            }).catch(err => {
                alert("Gagal mengcopy kode: " + err);
            });
        }

        window.onload = function() {
            renderForm();
            generateSVG();
        };
    </script>
</body>
</html>
